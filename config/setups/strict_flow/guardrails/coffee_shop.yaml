guardrails:
  - id: handover:allowed_targets
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: Handover target must be in the calling agent's allowed_handovers list.
    predicate: allowed_handover_targets

  - id: calculate_total:discount_within_limit_20pct
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: deny
    description: Deny calculate_total invocations with discount_percent above 20%.
    predicate: discount_within_limit
    predicate_args:
      max_pct: 20
      effect: deny

  # Order lifecycle — each state-changing tool may only be called from the order
  # statuses listed in `allowed`. This replaces the former OrderStateMachine; the
  # transition graph is implicit in these per-tool source preconditions.
  - id: check_inventory:order_status
    type: hard
    version: v1
    tools:
      - check_inventory
    effect: deny
    description: check_inventory may only run while the order is pending.
    predicate: require_order_status
    predicate_args:
      allowed: [pending]
      effect: deny

  - id: update_stock:order_status
    type: hard
    version: v1
    tools:
      - update_stock
    effect: deny
    description: update_stock may only run once inventory is confirmed.
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed]
      effect: deny

  - id: start_preparation:order_status
    type: hard
    version: v1
    tools:
      - start_preparation
    effect: deny
    description: start_preparation needs a confirmed order (or a prior prep to retry).
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed, in_preparation, preparation_error]
      effect: deny

  - id: end_preparation:order_status
    type: hard
    version: v1
    tools:
      - end_preparation
    effect: deny
    description: end_preparation may only run while a coffee is in preparation.
    predicate: require_order_status
    predicate_args:
      allowed: [in_preparation]
      effect: deny

  - id: offer_refund:order_status
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: deny
    description: offer_refund may only run on a completed order.
    predicate: require_order_status
    predicate_args:
      allowed: [completed]
      effect: deny

  - id: assistant_message:on_menu_only
    type: soft
    version: v2
    tools:
      - assistant_message
    effect: deny
    description: >-
      LLM-as-judge that rejects any outgoing assistant message which
      recommends, offers, or otherwise proposes an item that is not on the
      coffee shop menu. Menu adherence is checked against the current MENU
      keys plus ALLOWED_EXTRAS (both injected into the judge prompt).
    judge_prompt: |
      You are a strict menu-adherence auditor for a coffee shop assistant.

      MENU (only these items are available):
      {menu}

      ALLOWED EXTRAS / MODIFIERS:
      {allowed_extras}

      Sizes are small, medium and large; "normal" or "regular" means medium.
      Sizes are not menu items and never make a message off-menu.

      Task: decide whether the assistant's OUTGOING message recommends,
      offers, suggests or promises a drink, food or other item that is NOT
      on the MENU.

      Rules:
      - Talking about MENU items, with or without ALLOWED EXTRAS, is fine
        ("latte with oat milk", "americano with an extra shot").
      - Flavour shorthand built from an allowed extra is fine: "vanilla
        latte" is a latte with vanilla syrup, "caramel latte" a latte with
        caramel syrup.
      - Declining or naming an off-menu item is fine ("we don't serve
        mocha", "tea isn't on our menu").
      - Offering a MENU item for free or as a replacement is fine.
      - DENY only when the message offers or recommends something that is
        not on the MENU, e.g. "How about a hazelnut latte?" (hazelnut is not
        an allowed extra), "Try our caramel macchiato" (macchiato is not on
        the menu), "We have chocolate croissants" (only plain croissants).

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<one sentence naming the off-menu item(s)>", "decision": "deny"}}

      The reason is shown to the assistant so it can revise.
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies: []

  - id: process_order:items_on_menu
    type: hard
    version: v1
    tools:
      - process_order
    effect: deny
    description: Deterministic menu-adherence check on process_order; complements the soft assistant_message:on_menu_only judge.
    predicate: process_order_items_on_menu
    predicate_args:
      effect: deny

  - id: offer_partial_refund:within_policy_cap
    type: hard
    version: v1
    tools:
      - offer_partial_refund
    effect: deny
    description: Policy cap — partial refund percent must not exceed 50% of the order total.
    predicate: refund_within_limit
    predicate_args:
      max_pct: 50
      min_pct: 0
      effect: deny

  - id: transfer:context_summary_nonempty
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: deny
    description: Handovers must carry a non-trivial context_summary (>= 20 chars after strip).
    predicate: transfer_context_summary_nonempty
    predicate_args:
      min_chars: 20
      effect: deny

  - id: clean_machine:only_after_error
    type: hard
    version: v1
    tools:
      - clean_machine
    effect: deny
    description: clean_machine only allowed when the most-recent order is in preparation_error or the last brew was contaminated.
    predicate: clean_machine_only_after_error
    predicate_args:
      effect: deny

  - id: handover:reason_matches_target
    type: soft
    version: v2
    tools:
      - transfer_to_agent
    effect: deny
    description: LLM-as-judge — the handover's context_summary must justify the chosen target_agent's scope.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee-shop
      multi-agent system. Each specialist has a scope:
        - order_agent: takes new orders (also replacement orders), prices and creates them
        - inventory_agent: checks and updates stock for a placed order, places food on the tray
        - barista_agent: brews the coffee of a confirmed order, places coffee on the tray
        - customer_service_agent: handles complaints, problems with an order, and refunds

      The normal flow is order_agent -> inventory_agent -> barista_agent. A
      handover along that flow is in scope even when the summary mentions the
      drinks to brew or the items to prepare.

      Calling agent: {agent_id}
      Proposed target: read from `target_agent` in the tool call.

      Recent dialogue (oldest first):
      {recent_dialogue}

      Earlier tool calls in this conversation (oldest first; "ok" = ran
      successfully, "failed" = the tool reported an error, "blocked" = a
      guardrail stopped it):
      {tool_results}

      Rule: DENY only when the `context_summary` clearly asks the target for
      work outside its scope, e.g. a refund or complaint sent to barista_agent
      or inventory_agent, a refund without a replacement order sent to
      order_agent, or a plain new order sent to customer_service_agent.
      Ambiguous, mixed or procedural handovers: ALLOW.

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<one sentence naming the mismatch>", "decision": "deny"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - recent_dialogue
      - tool_results

  - id: assistant_message:no_price_promises
    type: soft
    version: v2
    tools:
      - assistant_message
    effect: deny
    description: LLM-as-judge — block messages that quote a specific dollar amount no earlier calculate_total / process_order / offer_refund / offer_partial_refund result produced.
    judge_prompt: |
      You are auditing an outgoing assistant message in a coffee shop.

      Rule: the assistant may only quote a specific dollar amount (an item
      price, an order total, a discount, a refund or a remaining balance)
      when that amount appears in an "ok" result of an earlier
      calculate_total, process_order, offer_refund or offer_partial_refund
      call below.

      Earlier tool calls in this conversation (oldest first; "ok" = ran
      successfully, "failed" = the tool reported an error, "blocked" = a
      guardrail stopped it):
      {tool_results}

      - A message without a specific dollar amount (digits together with "$"
        or "dollars") is ALLOWED. Do not infer implied prices.
      - Vague statements ("around five dollars", "a couple of dollars") and
        saying that something is free are ALLOWED.
      - Amounts match when they are equal in cents ("$8" = "$8.00").
      - Menu prices do not count; the amount must come from a tool result.
      - DENY only when the message quotes a specific dollar amount that no
        "ok" result above contains.

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<one sentence quoting the unbacked amount>", "decision": "deny"}}
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies:
      - tool_results

  # Strict-only extras.
  - id: process_order:max_calls
    type: hard
    version: v1
    tools:
      - process_order
    effect: deny
    description: process_order may be called at most once per conversation.
    predicate: max_tool_calls
    predicate_args:
      tool_name: process_order
      max_calls: 1
      effect: deny

  - id: process_order:size_within_range
    type: hard
    version: v1
    tools:
      - process_order
    effect: deny
    description: Order size must be between 1 and 8 units (summed quantities).
    predicate: order_size_within_range
    predicate_args:
      min_units: 1
      max_units: 8
      effect: deny

  - id: calculate_total:total_within_limit
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: deny
    description: Order total must not exceed $100.
    predicate: order_total_within_limit
    predicate_args:
      max_total: 100
      effect: deny

  # Predicate hard-codes Effect.FLAG on violation (see predicates.py). Deny
  # enforcement lives in the `include_order_id_in_handoff` guideline (and in
  # strict_flow_soft's soft_transfer:includes_order_id).
  - id: transfer:includes_order_id
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: Flag transfer_to_agent calls whose context_summary does not include an ORD#### order id.
    predicate: transfer_includes_order_id
    predicate_args:
      effect: flag
      only_after_order_placed: true

  - id: offer_refund:max_calls
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: deny
    description: offer_refund may be called at most once per conversation.
    predicate: max_tool_calls
    predicate_args:
      tool_name: offer_refund
      max_calls: 1
      effect: deny

  - id: offer_partial_refund:max_calls
    type: hard
    version: v1
    tools:
      - offer_partial_refund
    effect: deny
    description: offer_partial_refund may be called at most once per conversation.
    predicate: max_tool_calls
    predicate_args:
      tool_name: offer_partial_refund
      max_calls: 1
      effect: deny

  - id: clean_machine:max_calls
    type: hard
    version: v1
    tools:
      - clean_machine
    effect: deny
    description: clean_machine may be called at most twice per conversation.
    predicate: max_tool_calls
    predicate_args:
      tool_name: clean_machine
      max_calls: 2
      effect: deny
