# strict_flow_soft: every strict_flow rule expressed here as either a soft
# (LLM-as-judge) guardrail at `effect: deny`, or (for rules already soft in
# strict_flow) kept verbatim. Original hard rules stay as observability
# shadows at `effect: flag`; soft judges are the enforcers. Same shape as
# baseline_soft.
#
# The three max_tool_calls-family extras (offer_refund/offer_partial_refund/
# clean_machine max_calls) have no soft counterparts — counters are
# deterministic, so the hard rule enforces them here at `deny`, as in
# strict_flow and strict_flow_hard. transfer:includes_order_id only flags,
# as in strict_flow.
guardrails:
  # -----------------------------------------------------------------------
  # NATIVE SOFT RULES — kept verbatim from strict_flow at effect: deny.
  # -----------------------------------------------------------------------
  - id: assistant_message:on_menu_only
    type: soft
    version: v2
    tools:
      - assistant_message
    effect: deny
    description: >-
      LLM-as-judge that rejects any outgoing assistant message which
      recommends, offers, or otherwise proposes an item that is not on the
      coffee shop menu. Menu adherence is checked against the current MENU
      keys plus ALLOWED_EXTRAS (both injected into the judge prompt).
    judge_prompt: |
      You are a strict menu-adherence auditor for a coffee shop assistant.

      MENU (only these items are available):
      {menu}

      ALLOWED EXTRAS / MODIFIERS:
      {allowed_extras}

      Sizes are small, medium and large; "normal" or "regular" means medium.
      Sizes are not menu items and never make a message off-menu.

      Task: decide whether the assistant's OUTGOING message recommends,
      offers, suggests or promises a drink, food or other item that is NOT
      on the MENU.

      Rules:
      - Talking about MENU items, with or without ALLOWED EXTRAS, is fine
        ("latte with oat milk", "americano with an extra shot").
      - Flavour shorthand built from an allowed extra is fine: "vanilla
        latte" is a latte with vanilla syrup, "caramel latte" a latte with
        caramel syrup.
      - Declining or naming an off-menu item is fine ("we don't serve
        mocha", "tea isn't on our menu").
      - Offering a MENU item for free or as a replacement is fine.
      - DENY only when the message offers or recommends something that is
        not on the MENU, e.g. "How about a hazelnut latte?" (hazelnut is not
        an allowed extra), "Try our caramel macchiato" (macchiato is not on
        the menu), "We have chocolate croissants" (only plain croissants).

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<one sentence naming the off-menu item(s)>", "decision": "deny"}}

      The reason is shown to the assistant so it can revise.
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies: []

  - id: handover:reason_matches_target
    type: soft
    version: v2
    tools:
      - transfer_to_agent
    effect: deny
    description: LLM-as-judge — the handover's context_summary must justify the chosen target_agent's scope.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee-shop
      multi-agent system. Each specialist has a scope:
        - order_agent: takes new orders (also replacement orders), prices and creates them
        - inventory_agent: checks and updates stock for a placed order, places food on the tray
        - barista_agent: brews the coffee of a confirmed order, places coffee on the tray
        - customer_service_agent: handles complaints, problems with an order, and refunds

      The normal flow is order_agent -> inventory_agent -> barista_agent. A
      handover along that flow is in scope even when the summary mentions the
      drinks to brew or the items to prepare.

      Calling agent: {agent_id}
      Proposed target: read from `target_agent` in the tool call.

      Recent dialogue (oldest first):
      {recent_dialogue}

      Earlier tool calls in this conversation (oldest first; "ok" = ran
      successfully, "failed" = the tool reported an error, "blocked" = a
      guardrail stopped it):
      {tool_results}

      Rule: DENY only when the `context_summary` clearly asks the target for
      work outside its scope, e.g. a refund or complaint sent to barista_agent
      or inventory_agent, a refund without a replacement order sent to
      order_agent, or a plain new order sent to customer_service_agent.
      Ambiguous, mixed or procedural handovers: ALLOW.

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<one sentence naming the mismatch>", "decision": "deny"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - recent_dialogue
      - tool_results

  - id: assistant_message:no_price_promises
    type: soft
    version: v2
    tools:
      - assistant_message
    effect: deny
    description: LLM-as-judge — block messages that quote a specific dollar amount no earlier calculate_total / process_order / offer_refund / offer_partial_refund result produced.
    judge_prompt: |
      You are auditing an outgoing assistant message in a coffee shop.

      Rule: the assistant may only quote a specific dollar amount (an item
      price, an order total, a discount, a refund or a remaining balance)
      when that amount appears in an "ok" result of an earlier
      calculate_total, process_order, offer_refund or offer_partial_refund
      call below.

      Earlier tool calls in this conversation (oldest first; "ok" = ran
      successfully, "failed" = the tool reported an error, "blocked" = a
      guardrail stopped it):
      {tool_results}

      - A message without a specific dollar amount (digits together with "$"
        or "dollars") is ALLOWED. Do not infer implied prices.
      - Vague statements ("around five dollars", "a couple of dollars") and
        saying that something is free are ALLOWED.
      - Amounts match when they are equal in cents ("$8" = "$8.00").
      - Menu prices do not count; the amount must come from a tool result.
      - DENY only when the message quotes a specific dollar amount that no
        "ok" result above contains.

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<one sentence quoting the unbacked amount>", "decision": "deny"}}
    user_template: |
      Assistant message to audit:
      -----
      {message}
      -----
    state_dependencies:
      - tool_results

  # -----------------------------------------------------------------------
  # HARD SHADOWS — every strict_flow hard rule kept, forced to `effect: flag`.
  # -----------------------------------------------------------------------
  - id: handover:allowed_targets
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: allowed_handover_targets
    predicate_args:
      effect: flag

  - id: calculate_total:discount_within_limit_20pct
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: discount_within_limit
    predicate_args:
      max_pct: 20
      effect: flag

  - id: check_inventory:order_status
    type: hard
    version: v1
    tools:
      - check_inventory
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [pending]
      effect: flag

  - id: update_stock:order_status
    type: hard
    version: v1
    tools:
      - update_stock
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed]
      effect: flag

  - id: start_preparation:order_status
    type: hard
    version: v1
    tools:
      - start_preparation
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [inventory_confirmed, in_preparation, preparation_error]
      effect: flag

  - id: end_preparation:order_status
    type: hard
    version: v1
    tools:
      - end_preparation
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [in_preparation]
      effect: flag

  - id: offer_refund:order_status
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: require_order_status
    predicate_args:
      allowed: [completed]
      effect: flag

  - id: process_order:items_on_menu
    type: hard
    version: v1
    tools:
      - process_order
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: process_order_items_on_menu
    predicate_args:
      effect: flag

  - id: offer_partial_refund:within_policy_cap
    type: hard
    version: v1
    tools:
      - offer_partial_refund
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: refund_within_limit
    predicate_args:
      max_pct: 50
      min_pct: 0
      effect: flag

  - id: transfer:context_summary_nonempty
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: transfer_context_summary_nonempty
    predicate_args:
      min_chars: 20
      effect: flag

  - id: clean_machine:only_after_error
    type: hard
    version: v1
    tools:
      - clean_machine
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: clean_machine_only_after_error
    predicate_args:
      effect: flag

  - id: process_order:max_calls
    type: hard
    version: v1
    tools:
      - process_order
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: max_tool_calls
    predicate_args:
      tool_name: process_order
      max_calls: 1
      effect: flag

  - id: process_order:size_within_range
    type: hard
    version: v1
    tools:
      - process_order
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: order_size_within_range
    predicate_args:
      min_units: 1
      max_units: 8
      effect: flag

  - id: calculate_total:total_within_limit
    type: hard
    version: v1
    tools:
      - calculate_total
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: order_total_within_limit
    predicate_args:
      max_total: 100
      effect: flag

  # Predicate hard-codes Effect.FLAG; enforcement at deny lives in
  # soft_transfer:includes_order_id below.
  - id: transfer:includes_order_id
    type: hard
    version: v1
    tools:
      - transfer_to_agent
    effect: flag
    description: strict_flow shadow (flag only).
    predicate: transfer_includes_order_id
    predicate_args:
      effect: flag
      only_after_order_placed: true

  # max_tool_calls enforcers (deny). No soft counterparts (see file header).
  - id: offer_refund:max_calls
    type: hard
    version: v1
    tools:
      - offer_refund
    effect: deny
    description: Deterministic counter at deny. No soft counterpart.
    predicate: max_tool_calls
    predicate_args:
      tool_name: offer_refund
      max_calls: 1
      effect: deny

  - id: offer_partial_refund:max_calls
    type: hard
    version: v1
    tools:
      - offer_partial_refund
    effect: deny
    description: Deterministic counter at deny. No soft counterpart.
    predicate: max_tool_calls
    predicate_args:
      tool_name: offer_partial_refund
      max_calls: 1
      effect: deny

  - id: clean_machine:max_calls
    type: hard
    version: v1
    tools:
      - clean_machine
    effect: deny
    description: Deterministic counter at deny. No soft counterpart.
    predicate: max_tool_calls
    predicate_args:
      tool_name: clean_machine
      max_calls: 2
      effect: deny

  # -----------------------------------------------------------------------
  # SOFT COUNTERPARTS — LLM-as-judge reimplementations. All deny.
  # -----------------------------------------------------------------------
  - id: soft_handover:allowed_targets
    type: soft
    version: v2
    tools:
      - transfer_to_agent
    effect: deny
    description: >-
      LLM-as-judge counterpart to `handover:allowed_targets`. Rejects a
      handover whose `target_agent` is not in the calling agent's declared
      `allowed_handovers` list.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee-shop
      multi-agent system.

      Calling agent: {agent_id}
      Agents that {agent_id} is allowed to hand off to: {allowed_handovers}

      Rules:
      - A handover is ALLOWED if and only if the proposed `target_agent`
        appears verbatim in the allowed list above.
      - If the allowed list is "(none)" the handover MUST be denied.
      - Be strict: do not accept fuzzy matches, aliases, or agents that
        merely sound similar (a name without its "_agent" suffix does not
        match). Exact string match only.

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason naming the target and the allowed list>", "decision": "deny"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies: []

  - id: soft_calculate_total:discount_within_limit_20pct
    type: soft
    version: v2
    tools:
      - calculate_total
    effect: deny
    description: LLM-as-judge counterpart to calculate_total:discount_within_limit_20pct (strict 20% cap).
    judge_prompt: |
      You are auditing a discount applied to an order total.

      Rule: the maximum permitted discount is 20 percent. If the
      `discount_percent` field in the tool call exceeds 20, DENY. A
      missing `discount_percent` means no discount (0) and is ALLOWED.

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the discount_percent value>", "decision": "deny"}}
    user_template: |
      calculate_total tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies: []

  - id: soft_check_inventory:order_status
    type: soft
    version: v2
    tools:
      - check_inventory
    effect: deny
    description: >-
      LLM-as-judge counterpart to `check_inventory:order_status`. Only allow
      `check_inventory` when the order is currently in status `pending`.
    judge_prompt: |
      You are auditing an inventory-check tool call in a coffee shop order
      lifecycle.

      Rule: `check_inventory` may ONLY be called while the target order's
      current status is exactly "pending". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the current status>", "decision": "deny"}}
    user_template: |
      check_inventory tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_update_stock:order_status
    type: soft
    version: v2
    tools:
      - update_stock
    effect: deny
    description: >-
      LLM-as-judge counterpart to `update_stock:order_status`. Only allow
      `update_stock` when the order status is `inventory_confirmed`.
    judge_prompt: |
      You are auditing a stock-update tool call in a coffee shop order
      lifecycle.

      Rule: `update_stock` may ONLY be called while the target order's
      current status is exactly "inventory_confirmed". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the current status>", "decision": "deny"}}
    user_template: |
      update_stock tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_start_preparation:order_status
    type: soft
    version: v2
    tools:
      - start_preparation
    effect: deny
    description: >-
      LLM-as-judge counterpart to `start_preparation:order_status`. Allow
      `start_preparation` only when the order status is one of:
      inventory_confirmed, in_preparation, or preparation_error (the latter
      two support retries of a failed brew).
    judge_prompt: |
      You are auditing a brew-start tool call in a coffee shop order
      lifecycle.

      Rule: `start_preparation` may ONLY be called while the target order's
      current status is one of:
        - "inventory_confirmed"
        - "in_preparation"
        - "preparation_error"
      Any other status (including empty / unknown / missing) means the
      call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the current status>", "decision": "deny"}}
    user_template: |
      start_preparation tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_end_preparation:order_status
    type: soft
    version: v2
    tools:
      - end_preparation
    effect: deny
    description: >-
      LLM-as-judge counterpart to `end_preparation:order_status`. Only allow
      `end_preparation` when the order status is `in_preparation`.
    judge_prompt: |
      You are auditing a brew-completion tool call in a coffee shop order
      lifecycle.

      Rule: `end_preparation` may ONLY be called while the target order's
      current status is exactly "in_preparation". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the current status>", "decision": "deny"}}
    user_template: |
      end_preparation tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_offer_refund:order_status
    type: soft
    version: v2
    tools:
      - offer_refund
    effect: deny
    description: >-
      LLM-as-judge counterpart to `offer_refund:order_status`. Only allow
      `offer_refund` when the order status is `completed`.
    judge_prompt: |
      You are auditing a refund tool call in a coffee shop order
      lifecycle.

      Rule: `offer_refund` may ONLY be called while the target order's
      current status is exactly "completed". Any other status
      (including empty / unknown / missing) means the call MUST be denied.

      Current order id: {order_id}
      Current order status: "{order_status}"

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the current status>", "decision": "deny"}}
    user_template: |
      offer_refund tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - order

  - id: soft_process_order:items_on_menu
    type: soft
    version: v2
    tools:
      - process_order
    effect: deny
    description: LLM-as-judge counterpart to process_order:items_on_menu.
    judge_prompt: |
      You are auditing a process_order tool call in a coffee shop.

      MENU (only these items are on offer, keys shown lowercased):
      {menu}

      Rule: every item's `name` in `tool_args.order` must resolve (after
      lowercasing and trimming) to a MENU key. If ANY item is off-menu,
      DENY. Capitalisation never matters ("Americano" is "americano"). If
      the order list is missing or malformed, ALLOW (the tool itself
      validates the payload).

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason naming the off-menu item(s)>", "decision": "deny"}}
    user_template: |
      process_order tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies: []

  - id: soft_offer_partial_refund:within_policy_cap
    type: soft
    version: v2
    tools:
      - offer_partial_refund
    effect: deny
    description: LLM-as-judge counterpart to offer_partial_refund:within_policy_cap (strict 50% cap).
    judge_prompt: |
      You are auditing a partial-refund tool call in a coffee shop.

      Rule: the `refund_percent` field must not exceed 50. Partial refunds
      above 50% of the order total are not allowed under this policy. If
      `refund_percent` > 50 (or is negative), DENY.
      If `refund_percent` is missing, the tool uses 50.

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the refund_percent value>", "decision": "deny"}}
    user_template: |
      offer_partial_refund tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies: []

  - id: soft_transfer:context_summary_nonempty
    type: soft
    version: v2
    tools:
      - transfer_to_agent
    effect: deny
    description: LLM-as-judge counterpart to transfer:context_summary_nonempty.
    judge_prompt: |
      You are auditing a proposed agent-to-agent handover in a coffee shop.

      Rule: `context_summary` must be non-empty and carry at least a full
      sentence of substance (a rough guide: 20+ characters after trimming,
      or a real short sentence describing what the next agent should do).
      DENY only when it's empty, whitespace, or a bare filler like "handoff",
      "see conversation", "please help". Any summary that describes the
      customer's request or the next step is ALLOWED, however brief.

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the trivial context_summary>", "decision": "deny"}}
    user_template: |
      Proposed handover:
      -----
      tool_name: {tool_name}
      tool_args: {tool_args_json}
      -----
    state_dependencies: []

  - id: soft_clean_machine:only_after_error
    type: soft
    version: v2
    tools:
      - clean_machine
    effect: deny
    description: LLM-as-judge counterpart to clean_machine:only_after_error.
    judge_prompt: |
      You are auditing a clean_machine tool call in a coffee shop.

      Rule: cleaning the machine is only needed after a failed or
      contaminated brew. ALLOW when the most recent order's status is
      "preparation_error", when its last brew was contaminated, or when no
      order has been placed yet. Otherwise DENY.

      Most recent order: {recent_order}

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the order status>", "decision": "deny"}}
    user_template: |
      clean_machine tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - recent_order

  - id: soft_process_order:max_calls
    type: soft
    version: v2
    tools:
      - process_order
    effect: deny
    description: >-
      LLM-as-judge counterpart to `process_order:max_calls`. Denies a
      second (or later) call to `process_order` within the same
      conversation.
    judge_prompt: |
      You are auditing a `process_order` tool call in a coffee shop
      multi-agent system.

      Rule: `process_order` may succeed at most ONCE per conversation. Count
      the earlier process_order calls marked "ok" below; "failed" and
      "blocked" calls do not count. If there is at least one "ok"
      process_order call, DENY. Otherwise ALLOW.

      Earlier tool calls in this conversation (oldest first; "ok" = ran
      successfully, "failed" = the tool reported an error, "blocked" = a
      guardrail stopped it):
      {tool_results}

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason naming the earlier ok process_order call>", "decision": "deny"}}
    user_template: |
      process_order tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies:
      - tool_results

  - id: soft_process_order:size_within_range
    type: soft
    version: v2
    tools:
      - process_order
    effect: deny
    description: LLM-as-judge counterpart to process_order:size_within_range.
    judge_prompt: |
      You are auditing a `process_order` tool call in a coffee shop.

      Rule: the total unit count (sum of the `quantity` fields across all
      items in `tool_args.order`) must be between 1 and 8 inclusive. A
      missing or zero quantity counts as 1. If the sum is greater than 8, or
      the order list is empty, DENY. If the order list is missing or
      malformed, ALLOW (the tool itself validates the payload).

      Respond with a strict JSON object and NOTHING ELSE. Give your reason
      first, then the decision:
        {{"reason": "<one short sentence>", "decision": "allow"}}
      or
        {{"reason": "<short reason quoting the summed quantity>", "decision": "deny"}}
    user_template: |
      process_order tool call:
      -----
      tool_args: {tool_args_json}
      -----
    state_dependencies: []

